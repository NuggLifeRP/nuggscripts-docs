name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing may write to the repository. Only the deploy job can publish.
permissions:
  contents: read

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This repository is public and the scripts it documents are paid
      # products. Fail before building if anything but documentation is here.
      - name: Documentation only — no product source, no credentials
        run: npm run check:source

      # Prices and descriptions come from Tebex. If Tebex cannot be reached,
      # the snapshot committed in src/data/catalog.json is used instead.
      - name: Refresh the store catalogue from Tebex
        run: npm run catalog || echo "Tebex unreachable - building from the committed catalogue snapshot"

      - run: npm run build

      # Fails the deploy rather than shipping a page with dead links.
      - run: npm run check:links

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
